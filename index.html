<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a1a">
<title>Denton HS — Mejia Schedule</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a1a;padding:12px 12px 24px;min-height:100vh}
  .card{max-width:480px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.04)}
  .header{background:#1a1a1a;padding:20px 20px 16px;text-align:center}
  .header h1{color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px}
  .header .name{font-size:13px;color:#e2e2e2;margin-top:4px;font-weight:600}
  .today-strip{margin:10px 0 0;display:flex;align-items:center;justify-content:center;gap:8px}
  .today-date{font-size:11px;color:#999}
  .today-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .today-dot.a-day{background:#3b82f6}.today-dot.b-day{background:#e85d75}.today-dot.no-school{background:#666}
  .today-ab{font-size:12px;font-weight:700;color:#fff}
  .today-override{background:0;border:0;color:#666;font-size:10px;cursor:pointer;font-family:inherit;text-decoration:underline;margin-left:2px}
  .day-tabs{display:flex;gap:8px;margin-top:10px}
  .day-tab{flex:1;padding:6px 0;border-radius:7px;font-weight:700;font-size:11px;letter-spacing:1px;color:#fff;text-align:center;opacity:.35;transition:opacity .2s}
  .day-tab.active{opacity:1}
  .tab-a{background:#3b82f6}.tab-b{background:#e85d75}

  /* Now bar */
  .now-bar{margin:8px 12px 0;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:12px}
  .now-bar.a-now{background:#eff6ff;border:1.5px solid #bfdbfe}
  .now-bar.b-now{background:#fef2f2;border:1.5px solid #fecaca}
  .now-bar.neutral{background:#f5f5f4;border:1.5px solid #e7e5e4}
  .now-period{font-family:'Courier New',monospace;font-size:11px;font-weight:700;color:#888;white-space:nowrap}
  .now-info{flex:1;min-width:0}
  .now-class{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now-room{font-family:'Courier New',monospace;font-size:12px;color:#666;margin-top:1px}
  .now-status{font-size:13px;font-weight:600;color:#888}

  /* Controls row */
  .controls{margin:0 12px;display:flex;gap:8px;margin-top:6px;align-items:center}
  .ctrl-label{font-size:10px;font-weight:600;color:#aaa;white-space:nowrap}
  .ctrl-pills{display:flex;gap:4px;flex:1}
  .ctrl-pill{flex:1;padding:4px 0;border-radius:5px;border:1px solid #e5e5e5;background:#fff;font-size:10px;font-weight:600;color:#bbb;text-align:center;cursor:pointer;font-family:inherit;transition:all .15s}
  .ctrl-pill.active{border-color:#93c5fd;background:#eff6ff;color:#2563eb}
  .ctrl-pill.active-g{border-color:#a3a3a3;background:#f5f5f4;color:#444}
  .pep-rally-bar{margin:0 12px;padding:5px 12px;background:#fef2f2;border-radius:6px;text-align:center;font-size:11px;font-weight:600;color:#dc2f4e;margin-top:4px}

  /* Schedule */
  .schedule{padding:4px 12px 4px}
  .period-label{display:flex;align-items:baseline;gap:8px;padding:10px 8px 4px}
  .period-num{font-family:'Courier New',monospace;font-size:12px;font-weight:700;color:#888}
  .period-time{font-family:'Courier New',monospace;font-size:11px;color:#aaa}
  .period-note{font-size:10px;color:#bbb;margin-left:auto}
  .period-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
  .cell{border-radius:10px;padding:10px 14px;min-height:56px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;position:relative;transition:opacity .2s,transform .2s}
  .cell:active{opacity:.7}
  .cell.dimmed{opacity:.45;transform:scale(.97)}
  .cell.highlighted{box-shadow:0 0 0 2.5px rgba(0,0,0,.12);transform:scale(1.01)}
  .cell.now-active{box-shadow:0 0 0 2px #3b82f6}
  .cell-a{background:#eff6ff;border:1.5px solid #bfdbfe}
  .cell-b{background:#fef2f2;border:1.5px solid #fecaca}
  .cell-plan{background:#f5f5f4;border:1.5px solid #e7e5e4}
  .class-name{font-weight:700;font-size:14px;line-height:1.2;display:flex;align-items:center;gap:6px}
  .teacher{font-size:12px;color:#555;margin-top:1px}
  .class-room{font-family:'Courier New',monospace;font-size:12px;color:#666;margin-top:2px}
  .students{font-size:10px;color:#999;margin-top:4px}
  .planning-text{font-weight:600;font-size:14px;color:#999;font-style:italic}
  .same-badge{font-family:'Courier New',monospace;font-size:9px;font-weight:700;color:#16a34a;background:#f0fdf4;border:1px solid #bbf7d0;padding:1px 5px;border-radius:4px}
  .edit-hint{font-size:9px;color:#ccc;position:absolute;bottom:3px;right:8px}
  .lunch-breakdown{margin-top:4px;padding:5px 8px;border-radius:6px;background:rgba(0,0,0,.04);font-size:10px;color:#777;font-family:'Courier New',monospace;line-height:1.6}
  .lunch-break-tag{display:inline-block;background:#fef3c7;color:#92400e;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;font-family:system-ui,sans-serif}
  .divider{height:1px;background:#eee;margin:6px 8px 4px}
  .lunch-ref{background:#fafaf9;margin:4px 12px 12px;border-radius:10px;padding:14px 16px;border:1px solid #e7e5e4}
  .lunch-ref-title{font-weight:700;font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  .lunch-ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
  .lunch-ref-item{font-family:'Courier New',monospace;font-size:12px;color:#555;display:flex;gap:8px;padding:2px 0}
  .lunch-ref-letter{font-weight:700;color:#1a1a1a}
  .footer-note{text-align:center;padding:8px 16px 12px;font-size:11px;color:#999;line-height:1.5}
  .footer-note strong{color:#666}
  .reset-row{text-align:center;padding:0 16px 16px}
  .reset-btn{background:0;border:0;font-size:11px;color:#bbb;cursor:pointer;text-decoration:underline;font-family:inherit}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="card" id="card"></div>
<div class="toast" id="toast">✓ Saved</div>
<script>
// ============================================================
// CONFIG
// ============================================================
var FIRST_A_DAY='2026-08-13',LAST_DAY='2027-05-27';
var NO_SCHOOL=['2026-09-07','2026-09-21','2026-10-12','2026-10-13','2026-11-23','2026-11-24','2026-11-25','2026-11-26','2026-11-27','2026-12-21','2026-12-22','2026-12-23','2026-12-24','2026-12-25','2026-12-28','2026-12-29','2026-12-30','2026-12-31','2027-01-01','2027-01-04','2027-01-18','2027-02-12','2027-02-15','2027-03-08','2027-03-09','2027-03-10','2027-03-11','2027-03-12','2027-03-15'];
var LUNCH_TIMES={A:{s:'11:20',e:'11:50'},B:{s:'11:55',e:'12:25'},C:{s:'12:30',e:'1:00'},D:{s:'1:05',e:'1:35'}};
var P3S='11:25',P3E='1:35';

// Bell schedules: [start_minutes, end_minutes] for each period
// Minutes from midnight for easy comparison
var BELL={
  normal: {times:['8:50 – 9:45','9:50 – 11:20','11:25 – 1:35','1:40 – 3:10','3:15 – 4:10'],
           mins:[[530,585],[590,680],[685,815],[820,910],[915,970]]},
  pep:    {times:['8:50 – 9:45','9:50 – 11:20','11:25 – 1:35','1:40 – 3:10','3:15 – 3:30'],
           mins:[[530,585],[590,680],[685,815],[820,910],[915,930]],pep:[935,970]},
  early:  {times:['8:50 – 9:37','9:42 – 10:29','10:34 – 11:21','11:26 – 12:13','12:18 – 1:05'],
           mins:[[530,577],[582,629],[634,681],[686,733],[738,785]]}
};
var BELL_LABELS={normal:'Normal',pep:'Pep Rally',early:'Early Release'};

// ============================================================
// DEFAULT SCHEDULE
// ============================================================
var DEFAULT=[
  {id:1,p:'1st',a:{name:'Planning',teacher:'',room:'',students:''},b:{name:'Planning',teacher:'',room:'',students:''}},
  {id:2,p:'2nd',a:{name:'Aquatic Science',teacher:'Rodriguez',room:'B202',students:'AB, AT, KT, ZW'},b:{name:'Planning',teacher:'',room:'',students:''}},
  {id:3,p:'3rd',a:{name:'PE',teacher:'Garrett',room:'D208 / Gym C',students:'CG, JDD, AI, JP, SM, OC'},b:{name:'PABS',teacher:'Tylec',room:'A104',students:'JP'}},
  {id:4,p:'4th',a:{name:'Eng 4',teacher:'Russell',room:'A220',students:'ZW'},b:{name:'M Enviro Sci',teacher:'Moody',room:'B202',students:'JDL'}},
  {id:5,p:'5th',a:{name:'Incl. Algebra 1',teacher:'Boykin',room:'B121',students:'OC'},b:{name:'Incl. Algebra 1',teacher:'Boykin',room:'B121',students:'OC'}}
];
var LREF=[{l:'A',t:'11:20 – 11:50'},{l:'B',t:'11:55 – 12:25'},{l:'C',t:'12:30 – 1:00'},{l:'D',t:'1:05 – 1:35'}];

// ============================================================
// STATE
// ============================================================
var SK='denton-mejia-v2',SS='denton-mejia-settings';
var schedule,settings;
try{var rs=localStorage.getItem(SK);schedule=rs?JSON.parse(rs):JSON.parse(JSON.stringify(DEFAULT));}catch(e){schedule=JSON.parse(JSON.stringify(DEFAULT));}
try{var rt=localStorage.getItem(SS);settings=rt?JSON.parse(rt):{lunchA:'',lunchB:'',override:'',bell:'normal'};}catch(e){settings={lunchA:'',lunchB:'',override:'',bell:'normal'};}
if(!settings.bell)settings.bell='normal';

function saveSchedule(){localStorage.setItem(SK,JSON.stringify(schedule));showToast();}
function saveSettings(){localStorage.setItem(SS,JSON.stringify(settings));}
function showToast(){var t=document.getElementById('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1400);}

// ============================================================
// A/B DAY LOGIC
// ============================================================
function parseD(s){var p=s.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));}
function fmtD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isOff(s){return NO_SCHOOL.indexOf(s)!==-1;}
function isWE(d){var w=d.getDay();return w===0||w===6;}
function getAB(dateStr){
  var d=parseD(dateStr),first=parseD(FIRST_A_DAY),last=parseD(LAST_DAY);
  if(d<first||d>last)return'off';if(isWE(d))return'off';if(isOff(dateStr))return'off';
  var count=0,cur=new Date(first);
  while(cur<d){cur.setDate(cur.getDate()+1);if(!isWE(cur)&&!isOff(fmtD(cur)))count++;}
  return(count%2===0)?'A':'B';
}
function todayStr(){return fmtD(new Date());}
function todayFmt(){var ds=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],n=new Date();return ds[n.getDay()]+', '+ms[n.getMonth()]+' '+n.getDate();}
function todayAB(){if(settings.override==='A'||settings.override==='B')return settings.override;return getAB(todayStr());}

// ============================================================
// "WHERE AM I NOW" LOGIC
// ============================================================
function nowMinutes(){var n=new Date();return n.getHours()*60+n.getMinutes();}

function getCurrentPeriod(){
  var now=nowMinutes();
  var bell=BELL[settings.bell]||BELL.normal;
  var mins=bell.mins;
  // Check each period
  for(var i=0;i<mins.length;i++){
    if(now>=mins[i][0]&&now<=mins[i][1]) return{status:'in',index:i};
  }
  // Check pep rally
  if(bell.pep&&now>=bell.pep[0]&&now<=bell.pep[1]) return{status:'pep'};
  // Before school
  if(now<mins[0][0]) return{status:'before'};
  // After school
  if(now>mins[mins.length-1][1]) return{status:'after',index:mins.length-1};
  // Between periods — find next
  for(var i=0;i<mins.length-1;i++){
    if(now>mins[i][1]&&now<mins[i+1][0]) return{status:'passing',index:i+1};
  }
  // After last period, before pep rally
  if(bell.pep&&now>mins[mins.length-1][1]&&now<bell.pep[0]) return{status:'passing_pep'};
  return{status:'after'};
}

// ============================================================
// HELPERS
// ============================================================
function isPlan(c){return c.name.toLowerCase()==='planning'&&!c.room;}
function isSame(r){return r.a.name===r.b.name&&r.a.room===r.b.room&&r.a.teacher===r.b.teacher&&!isPlan(r.a);}

function lunchBD(letter){
  if(!letter)return'';var lt=LUNCH_TIMES[letter];
  var h='<div class="lunch-breakdown">';
  if(letter==='A'){h+='<span class="lunch-break-tag">'+letter+' Lunch</span> '+lt.s+'–'+lt.e+' → Class '+lt.e+'–'+P3E;}
  else if(letter==='D'){h+='Class '+P3S+'–'+lt.s+' → <span class="lunch-break-tag">'+letter+' Lunch</span> '+lt.s+'–'+lt.e;}
  else{h+='Class '+P3S+'–'+lt.s+' → <span class="lunch-break-tag">'+letter+' Lunch</span> '+lt.s+'–'+lt.e+' → Class '+lt.e+'–'+P3E;}
  return h+'</div>';
}

// ============================================================
// ACTIONS
// ============================================================
function editCell(id,day){
  var row;for(var i=0;i<schedule.length;i++){if(schedule[i].id===id){row=schedule[i];break;}}
  if(!row)return;var c=row[day];var label=row.p+' '+(day==='a'?'A':'B')+' Day';
  var n=prompt(label+' — Class name:',c.name);if(n===null)return;
  var tc=prompt(label+' — Teacher:',c.teacher);if(tc===null)return;
  var rm=prompt(label+' — Room:',c.room);if(rm===null)return;
  var st=prompt(label+' — Students:',c.students);if(st===null)return;
  row[day]={name:n.trim()||'Planning',teacher:tc.trim(),room:rm.trim(),students:st.trim()};
  saveSchedule();render();
}
function setLunch(day,letter){var k='lunch'+day.toUpperCase();settings[k]=(settings[k]===letter)?'':letter;saveSettings();render();}
function toggleOverride(){if(settings.override){settings.override='';}else{var a=getAB(todayStr());settings.override=(a==='A')?'B':'A';}saveSettings();render();}
function setBell(type){settings.bell=type;saveSettings();render();}
function resetAll(){if(confirm('Reset everything?')){schedule=JSON.parse(JSON.stringify(DEFAULT));settings={lunchA:'',lunchB:'',override:'',bell:'normal'};saveSchedule();saveSettings();render();}}

// ============================================================
// RENDER
// ============================================================
function render(){
  var card=document.getElementById('card'),today=todayAB(),h='';
  var bell=BELL[settings.bell]||BELL.normal;
  var times=bell.times,isEarly=settings.bell==='early',isPep=settings.bell==='pep';
  var cp=getCurrentPeriod();
  var dayKey=today==='B'?'b':'a';

  // ---- Header ----
  h+='<div class="header">';
  h+='<h1>DENTON HIGH SCHOOL</h1>';
  h+='<div class="name">Mejia — Interpreter Schedule 26–27</div>';
  var dotC=today==='A'?'a-day':(today==='B'?'b-day':'no-school');
  h+='<div class="today-strip"><span class="today-date">'+todayFmt()+'</span><span class="today-dot '+dotC+'"></span>';
  if(today==='off'){h+='<span class="today-ab">No School</span>';}
  else{h+='<span class="today-ab">'+today+' Day</span><button class="today-override" onclick="toggleOverride()">'+(settings.override?'(auto)':'(switch)')+'</button>';}
  h+='</div>';
  var aA=(today==='A'||today==='off')?' active':'',bA=(today==='B'||today==='off')?' active':'';
  h+='<div class="day-tabs"><div class="day-tab tab-a'+aA+'">A DAY</div><div class="day-tab tab-b'+bA+'">B DAY</div></div>';
  h+='</div>';

  // ---- "Where Am I Now" Bar ----
  if(today!=='off'){
    var nowClass=today==='A'?'a-now':'b-now';
    h+='<div class="now-bar '+nowClass+'">';
    if(cp.status==='before'){
      h+='<div class="now-status">School starts at '+times[0].split(' ')[0]+'</div>';
    }else if(cp.status==='after'){
      h+='<div class="now-status">Done for the day ✌️</div>';
    }else if(cp.status==='pep'){
      h+='<div class="now-status">🎉 Pep Rally right now</div>';
    }else if(cp.status==='passing_pep'){
      h+='<div class="now-status">Next → 🎉 Pep Rally</div>';
    }else if(cp.status==='passing'){
      var nextRow=schedule[cp.index];
      var nextC=nextRow[dayKey];
      if(isPlan(nextC)){h+='<span class="now-period">'+nextRow.p+'</span><div class="now-info"><div class="now-status">Next → Planning</div></div>';}
      else{h+='<span class="now-period">'+nextRow.p+'</span><div class="now-info"><div class="now-class">Next → '+nextC.name+'</div><div class="now-room">'+nextC.room+'</div></div>';}
    }else if(cp.status==='in'){
      var curRow=schedule[cp.index];
      var curC=curRow[dayKey];
      if(isPlan(curC)){h+='<span class="now-period">'+curRow.p+'</span><div class="now-info"><div class="now-status">Planning</div></div>';}
      else{h+='<span class="now-period">'+curRow.p+'</span><div class="now-info"><div class="now-class">'+curC.name+'</div><div class="now-room">'+curC.room+'</div></div>';}
    }
    h+='</div>';
  }

  // ---- Controls: Bell + Lunch on one row each ----
  h+='<div class="controls"><span class="ctrl-label">Schedule</span><div class="ctrl-pills">';
  var bts=['normal','pep','early'];
  for(var bi=0;bi<bts.length;bi++){var bt=bts[bi];h+='<button class="ctrl-pill'+(settings.bell===bt?' active-g':'')+'" onclick="setBell(\''+bt+'\')">'+BELL_LABELS[bt]+'</button>';}
  h+='</div></div>';

  if(!isEarly){
    var lunchDay=today==='B'?'b':'a',lunchKey='lunch'+lunchDay.toUpperCase();
    h+='<div class="controls"><span class="ctrl-label">Lunch</span><div class="ctrl-pills">';
    var lts=['A','B','C','D'];
    for(var pi=0;pi<lts.length;pi++){var pl=lts[pi];h+='<button class="ctrl-pill'+(settings[lunchKey]===pl?' active':'')+'" onclick="setLunch(\''+lunchDay+'\',\''+pl+'\')">'+pl+'</button>';}
    h+='</div></div>';
  }

  // ---- Schedule Grid ----
  h+='<div class="schedule">';
  for(var i=0;i<schedule.length;i++){
    var row=schedule[i],same=isSame(row);
    var note=(i===2&&!isEarly)?'90+30 min lunch':'';
    h+='<div class="period-label"><span class="period-num">'+row.p+'</span><span class="period-time">'+times[i]+'</span>';
    if(note)h+='<span class="period-note">'+note+'</span>';
    h+='</div>';

    // Always show two columns (even for same classes — so 5th can be split)
    h+='<div class="period-row">';
    var sides=['a','b'];
    for(var d=0;d<2;d++){
      var day=sides[d],c=row[day],plan=isPlan(c);
      var cls=plan?'cell-plan':(day==='a'?'cell-a':'cell-b');
      var ex='';
      if(today==='A'&&day==='b')ex=' dimmed';
      if(today==='B'&&day==='a')ex=' dimmed';
      if(today==='A'&&day==='a')ex=' highlighted';
      if(today==='B'&&day==='b')ex=' highlighted';
      // Highlight current period
      if(cp.status==='in'&&cp.index===i&&day===dayKey)ex+=' now-active';

      h+='<div class="cell '+cls+ex+'" onclick="editCell('+row.id+',\''+day+'\')">';
      if(plan){h+='<span class="planning-text">Planning</span>';}
      else{
        h+='<div class="class-name">'+c.name;
        if(same)h+=' <span class="same-badge">SAME</span>';
        h+='</div>';
        if(c.teacher)h+='<div class="teacher">'+c.teacher+'</div>';
        if(c.room)h+='<span class="class-room">'+c.room+'</span>';
        if(c.students)h+='<div class="students">'+c.students+'</div>';
      }
      if(i===2&&!isEarly){var lk=day==='a'?settings.lunchA:settings.lunchB;h+=lunchBD(lk);}
      h+='<span class="edit-hint">tap to edit</span></div>';
    }
    h+='</div>';
    if(i===1||i===3)h+='<div class="divider"></div>';
  }

  if(isPep)h+='<div class="pep-rally-bar">🎉 Pep Rally  3:35 – 4:10</div>';
  h+='</div>';

  // Lunch ref
  if(!isEarly){
    h+='<div class="lunch-ref"><div class="lunch-ref-title">All Lunch Times — 3rd Block</div><div class="lunch-ref-grid">';
    for(var j=0;j<LREF.length;j++){h+='<div class="lunch-ref-item"><span class="lunch-ref-letter">'+LREF[j].l+'</span><span>'+LREF[j].t+'</span></div>';}
    h+='</div></div>';
  }

  h+='<div class="footer-note"><strong>Tap any class to edit</strong> · changes save automatically</div>';
  h+='<div class="reset-row"><button class="reset-btn" onclick="resetAll()">Reset to original</button></div>';
  card.innerHTML=h;
}

// Auto-refresh every minute so the "now" bar stays current
render();
setInterval(render,60000);
</script>
</body>
</html>
